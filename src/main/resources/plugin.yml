name: MiraBounties
version: ${version}
main: com.mira.bounties.MiraBountiesPlugin
api-version: '1.21'
authors: [FiveS]
description: Persistent player bounty hunting for the Mira plugin ecosystem.
depend: [Vault, MiraCore]
softdepend: [PlaceholderAPI, MiraLeaderboards, MiraNPC, MiraCosmetics]

commands:
  bounty:
    description: View, post and manage player bounties.
    usage: /bounty [player|top|hunters|history|admin]
    aliases: [bounties]

permissions:
  mirabounties.use:
    default: true
    description: Allows normal bounty use.
  mirabounties.post:
    default: true
    description: Allows posting bounties.
  mirabounties.admin:
    default: op
    description: Allows bounty administration.
