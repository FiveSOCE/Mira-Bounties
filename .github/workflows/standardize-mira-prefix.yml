name: Standardize Mira chat prefix
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/standardize-mira-prefix.yml' ]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Standardize player chat prefix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          PREFIX='&5&lMira &8>> &r'
          for p in Path('src/main/resources').rglob('*.yml') if Path('src/main/resources').exists() else []:
              if p.name == 'plugin.yml':
                  continue
              text=p.read_text()
              changed=False
              lines=text.splitlines()
              out=[]
              found=False
              for line in lines:
                  if re.match(r'^\s*prefix\s*:', line, re.I):
                      indent=re.match(r'^(\s*)', line).group(1)
                      line=f"{indent}prefix: '{PREFIX}'"
                      found=True; changed=True
                  out.append(line)
              text='\n'.join(out) + ('\n' if p.read_text().endswith('\n') else '')
              if p.name == 'config.yml' and not found:
                  m=re.search(r'(?m)^messages:\s*$', text)
                  if m:
                      pos=m.end()
                      text=text[:pos]+f"\n  prefix: '{PREFIX}'"+text[pos:]
                  else:
                      text=text.rstrip()+f"\n\nmessages:\n  prefix: '{PREFIX}'\n"
                  changed=True
              if changed:
                  p.write_text(text)
          helper=re.compile(r'((?:public|private|protected)?\s*(?:static\s+)?void\s+(?:msg|message|sendMessage|broadcast)\s*\([^)]*String\s+(?P<var>\w+)[^)]*\)\s*\{)(?P<body>[^{}]*)(\})', re.S)
          for p in Path('src/main/java').rglob('*.java') if Path('src/main/java').exists() else []:
              text=p.read_text()
              text=re.sub(r'(getString\(\s*"(?:messages\.)?prefix"\s*,\s*)"(?:\\.|[^"\\])*"', lambda m:m.group(1)+'"'+PREFIX+'"', text)
              text=re.sub(r'(?im)(\b(?:CHAT_)?PREFIX\b\s*=\s*)"(?:\\.|[^"\\])*"', lambda m:m.group(1)+'"'+PREFIX+'"', text)
              def fix(m):
                  body=m.group('body'); var=m.group('var')
                  if 'prefix' in body.lower() or PREFIX in body or ('sendMessage' not in body and 'broadcastMessage' not in body):
                      return m.group(0)
                  pat=re.compile(r'((?:sendMessage|broadcastMessage)\s*\([^;]*?)(\b'+re.escape(var)+r'\b)', re.S)
                  body2,n=pat.subn(lambda x:x.group(1)+'"'+PREFIX+'" + '+var, body, count=1)
                  return m.group(1)+body2+m.group(4) if n else m.group(0)
              text=helper.sub(fix,text)
              p.write_text(text)
          PY
      - name: Verify build
        run: gradle clean build
      - name: Commit migration
        shell: bash
        run: |
          rm -f .github/workflows/standardize-mira-prefix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Standardize Mira chat prefix'
            git push
          fi
