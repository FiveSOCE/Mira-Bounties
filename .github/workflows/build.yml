name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MiraBounties-0.1.1
          path: build/libs/MiraBounties-0.1.1.jar

      - name: Publish v0.1.1 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.1 >/dev/null 2>&1; then
            gh release create v0.1.1 \
              build/libs/MiraBounties-0.1.1.jar \
              --target "${{ github.sha }}" \
              --title "MiraBounties v0.1.1" \
              --notes "Promotes MiraBounties to the suite bounty authority with persistent claim history, hunter rankings, MiraCore milestones/audit integration, richer API/PAPI data and safer expired-contribution refunds."
          fi
