name: Release v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: f5bacc9b81c7c2478061c589a10bc906ac9e7c22
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 \
            build/libs/MiraBounties-0.1.0.jar \
            --target f5bacc9b81c7c2478061c589a10bc906ac9e7c22 \
            --title "MiraBounties v0.1.0" \
            --notes "Initial standalone MiraBounties release with persistent Vault-backed bounty contributions, expiry/refunds, automatic kill payouts, leaderboards, PlaceholderAPI and public ServicesManager API."
